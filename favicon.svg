<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="finovaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Frame -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#finovaGrad)" />
  
  <!-- Subtle Inner Overlay -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#0f172a" fill-opacity="0.25" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Stylized Geometric 'F' + Upward Growth Arrow Emblem -->
  <path d="M 160 140 
           L 360 140 
           C 376 140, 388 152, 388 168 
           C 388 184, 376 196, 360 196 
           L 224 196 
           L 224 236 
           L 320 236 
           C 336 236, 348 248, 348 264 
           C 348 280, 336 292, 320 292 
           L 224 292 
           L 224 372 
           C 224 388, 212 400, 196 400 
           C 180 400, 168 388, 168 372 
           L 168 168 
           C 168 152, 180 140, 196 140 Z" 
        fill="#ffffff" 
        filter="url(#dropGlow)" />

  <!-- Dynamic Upward Growth Trend Arrow Accent -->
  <path d="M 280 340 L 360 260 L 320 260 L 360 260 L 360 300" 
        stroke="#10b981" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
  
  <!-- Glowing Diamond Node at top right -->
  <circle cx="360" cy="168" r="14" fill="#6ee7b7" />
</svg>
