# ═════════════════════════════════════════════════════════════════════
# RENDER BLUEPRINT - FINOVA PRO FULL-STACK WEB SERVICE
# ═════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: finova-pro-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
